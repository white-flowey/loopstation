<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drumloop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta charset="utf-8">
<title>Drumloop Station</title>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: header row; below, per station a console row (2 loop tracks) with its instrument to the right, vertically centred on it; one master column spans the stations. Flat, single dark hardware look. */
:root{
  --bg:#111316; --panel:#1a1d21; --raised:#262a30; --raised2:#30353c; --line:#30353c; --fg:#e9ebee; --dim:#7f8791;
  --rec:#ff4a3d; --play:#3ad17c; --dub:#ffb224; --pad:#262a30; --glow:#f4f1e6;
  --f-num:"SF Mono", ui-monospace, Menlo, "Roboto Mono", monospace;
  --f-ui:"Avenir Next Condensed", "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --fh:170px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);height:100%}
body{font-family:var(--f-ui);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible,.fader:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* header row */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tabs,.seg{display:flex;gap:4px}
.tabs button{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--dim);height:34px;padding:0 10px;border-radius:8px}
.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raised)}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.bpm{display:flex;align-items:center;gap:4px}
.step{width:34px;height:34px;border-radius:8px;background:var(--raised);font-size:20px;line-height:1}
.bpmval{display:flex;align-items:baseline;gap:5px;padding:0 4px}
#bpm{width:3.3ch;background:none;border:0;color:var(--fg);font:600 28px/1 var(--f-num);text-align:right;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
#bpm::-webkit-inner-spin-button,#bpm::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:12px;letter-spacing:.12em;color:var(--dim)}
.chip{height:34px;padding:0 11px;border-radius:8px;background:var(--raised);font-weight:600;letter-spacing:.08em;font-size:14px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--fg)}
select{height:34px;border-radius:8px;background:var(--raised);border:0;color:var(--fg);font:600 15px var(--f-ui);letter-spacing:.04em;padding:0 8px}
#sig{font:600 16px var(--f-num)}
#sig:disabled{opacity:.45}
.pos{flex:1 1 120px;min-width:96px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;height:34px;background:#0c0d0f;border-radius:8px;padding:0 10px}
#posTxt{font:600 18px/1 var(--f-num);font-variant-numeric:tabular-nums;min-width:3.6ch}
#posLen{font:600 12px var(--f-num);color:var(--dim);white-space:nowrap}
#posCv{width:100%;height:16px;display:block}

/* main grid: consoles | master | instruments */
.main{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center}
.cons,.masterp,.prac{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.cons{padding:10px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;row-gap:12px;align-self:stretch}
.cons .kitsel{grid-column:1/3;width:100%}
#cons0{grid-column:1;grid-row:1}
#master{grid-column:2;grid-row:1;align-self:stretch}
#inst0{grid-column:1/3;grid-row:2}
#cons1{grid-column:1;grid-row:3}
#inst1{grid-column:1/3;grid-row:4}
.dbl #master{grid-row:1/4}
.dbl{--fh:clamp(40px,calc(50vh - 290px - env(safe-area-inset-top,0px)/2 - env(safe-area-inset-bottom,0px)/2),120px)}
.dbl .ch{gap:8px}.dbl .cons{row-gap:8px}.dbl .ring{max-width:112px}.dbl .stopbtn{width:36px;height:36px}
#prac{grid-column:1/3;grid-row:1}
.ch{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.ch + .ch{box-shadow:-6px 0 0 -5px var(--line)}
.cname{position:absolute;left:0;bottom:0;font:600 14px/1 var(--f-num);color:var(--fg)}
.clen{position:absolute;right:0;bottom:0;font:600 12px/1 var(--f-num);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.fwrap{height:var(--fh);display:flex;justify-content:center;width:100%;flex:none}
.fader{position:relative;width:44px;height:100%;touch-action:none;cursor:ns-resize}
.fader::before{content:"";position:absolute;inset:10px 0;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 12px);
  -webkit-mask:linear-gradient(to right,#000 0 8px,transparent 8px 36px,#000 36px);mask:linear-gradient(to right,#000 0 8px,transparent 8px 36px,#000 36px)}
.fader .groove{position:absolute;left:50%;top:10px;bottom:10px;width:4px;transform:translateX(-50%);background:#08090a;border-radius:2px}
.fader .cap{position:absolute;left:50%;width:36px;height:20px;transform:translate(-50%,-50%);border-radius:3px;background:var(--raised2);border:1px solid #4a515a}
.fader .cap::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;background:var(--fg)}
.stopbtn{width:42px;height:42px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);flex:none}
.stopbtn svg{width:14px;height:14px}
.stopbtn:active{background:var(--raised2)}
.ring{position:relative;width:100%;max-width:150px;aspect-ratio:1;border-radius:50%;touch-action:none;flex:none}
.ring canvas{position:absolute;inset:0;width:100%;height:100%}
.ring .face{position:absolute;inset:16%;border-radius:50%;background:var(--raised);border:1px solid #3a4048;display:grid;place-items:center}
.ring:active .face{background:var(--raised2)}
.ring .face svg{width:50%;height:auto;color:var(--fg)}
.ring.st-rec .face svg,.ring.st-armed .face svg{color:var(--rec)}
.ring.st-play .face svg{color:var(--play)}
.ring.st-dub .face svg{color:var(--dub)}
.ring.st-stop .face svg{color:var(--dim)}
.masterp{position:relative;display:flex;flex-direction:column;align-items:center;padding:56px 0 12px;gap:12px}
.masterp .fwrap{flex:1;height:auto;min-height:var(--fh);max-height:360px}
.masterp .cname{left:10px;bottom:10px}
.allbtn{width:52px;height:52px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;flex:none;margin-bottom:34px}
.allbtn svg{width:18px;height:18px}
.allbtn.on{background:var(--play);border-color:var(--play);color:var(--bg)}

/* instruments: frameless, centred on their station row */
.inst{min-width:0;display:flex;align-items:center;justify-content:center}
.inst svg{display:block;width:100%;height:auto;touch-action:none}
.inst svg [data-s]{cursor:pointer}
.inst svg text{font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;pointer-events:none}
.inst svg .fl{pointer-events:none;opacity:0}
.pads{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:110px;gap:10px}
.pad{position:relative;border-radius:12px;background:var(--pad);border:1px solid var(--line);overflow:hidden;touch-action:none;text-align:left;padding:10px}
.pad .nm{position:absolute;left:10px;bottom:9px;font-weight:600;font-size:16px;letter-spacing:.03em;z-index:1}
.pad .ky{position:absolute;right:9px;top:8px;font:12px var(--f-num);color:var(--dim);z-index:1}
.pad .gl{position:absolute;inset:0;background:var(--glow);opacity:0;pointer-events:none}
.pad.cym .nm{color:#e8d9a8}
.inst.loading{opacity:.5}

/* practice */
.prac{padding:12px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sep{flex:1}
.pread{display:flex;align-items:baseline;justify-content:center;gap:8px;font-variant-numeric:tabular-nums;min-height:56px}
#pOff{font:600 52px/1 var(--f-num);min-width:4ch;text-align:right}
#pWord{font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);min-width:6ch}
.prac canvas{width:100%;display:block}
#pMeter{height:86px}
#pBar{height:120px;background:var(--bg);border-radius:8px}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.pstats b{display:block;font:600 20px var(--f-num);font-variant-numeric:tabular-nums}
.pstats span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.small{width:36px;height:30px;border-radius:7px;background:var(--raised);display:grid;place-items:center;color:var(--dim)}
.small svg{width:15px;height:15px}
.big{width:56px;height:56px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center}
.big svg{width:20px;height:20px}
#pGo.on{background:var(--play);border-color:var(--play);color:var(--bg)}

/* landscape tablet / desktop: instruments to the right of their station, one screen, nothing scrolls */
@media (min-width:900px) and (min-height:600px){
  html,body{overflow:hidden;position:fixed;inset:0}
  .main{grid-template-columns:clamp(250px,25vw,320px) 64px minmax(0,1fr);align-items:center}
  #inst0{grid-column:3;grid-row:1}
  #cons1{grid-column:1;grid-row:2}
  #inst1{grid-column:3;grid-row:2}
  .dbl #master{grid-row:1/3}
  #prac{grid-column:1/3;grid-row:1}
  .dbl #prac{grid-row:1/3}
  .inst svg{max-height:calc(100vh - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .dbl .inst svg{max-height:calc(50vh - 56px - env(safe-area-inset-top,0px)/2)}
  .dbl .pads{grid-auto-rows:minmax(0,calc(25vh - 40px))}
}
@media (max-width:1100px){.bpmval .unit{display:none}.chip{padding:0 8px}.strip{gap:5px}.tabs button{padding:0 8px}.pos{min-width:70px}.step{width:30px}.vsep{display:none}}
@media (max-width:560px){
  .cons{column-gap:8px;padding:10px 8px}
  .pads{gap:7px;grid-auto-rows:80px}.pad{padding:8px}.pad .nm{font-size:14px;left:8px;bottom:7px}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="strip">
    <nav class="tabs" role="tablist">
      <button role="tab" id="tabLoop" aria-selected="true">Loop</button>
      <button role="tab" id="tabPrac" aria-selected="false">Übung</button>
    </nav>
    <span class="vsep"></span>
    <div class="bpm">
      <button class="step" id="bpmDown" aria-label="Tempo langsamer">−</button>
      <label class="bpmval"><input id="bpm" type="number" min="40" max="240" value="100" inputmode="numeric" aria-label="BPM"><span class="unit">BPM</span></label>
      <button class="step" id="bpmUp" aria-label="Tempo schneller">+</button>
      <button class="chip" id="tap">Tap</button>
    </div>
    <select id="sig" aria-label="Taktart">
      <option>2/4</option><option>3/4</option><option selected>4/4</option><option>5/4</option><option>6/8</option><option>7/8</option><option>12/8</option>
    </select>
    <button class="chip" id="click" aria-pressed="true" title="Metronom + 1 Takt Einzähler">Click</button>
    <button class="chip" id="sub" aria-pressed="false" title="Metronom: Viertel oder Achtel">♪ 1/8</button>
    <button class="chip" id="quant" aria-pressed="false" title="Quantisieren: aus / 1/16 / 1/8 / 1/4">Q <span id="qVal">aus</span></button>
    <div class="pos" aria-label="Taktposition"><span id="posTxt">–</span><canvas id="posCv"></canvas><span id="posLen"></span></div>
    <button class="chip" id="dblBtn" aria-pressed="false" title="Zweite Station mit eigenem Instrument">2×</button>
    <div class="seg" id="viewSeg" aria-label="Spielfläche">
      <button class="chip" data-v="kit" aria-pressed="true">Set</button>
      <button class="chip" data-v="pads" aria-pressed="false">Pads</button>
    </div>
  </header>

  <div class="main" id="main">
    <section class="cons" id="cons0"></section>
    <section class="masterp" id="master"></section>
    <div class="inst" id="inst0"></div>
    <section class="cons" id="cons1" hidden></section>
    <div class="inst" id="inst1" hidden></div>

    <section class="prac" id="prac" hidden>
      <div class="prow">
        <div class="seg" id="pdiv"><button class="chip" data-d="4" aria-pressed="false">1/4</button><button class="chip" data-d="8" aria-pressed="false">1/8</button><button class="chip" data-d="16" aria-pressed="true">1/16</button></div>
        <span class="sep"></span>
        <button class="small" id="pReset" aria-label="Auswertung zurücksetzen" title="Zurücksetzen"></button>
        <button class="big" id="pGo" aria-label="Übung starten / stoppen"></button>
      </div>
      <div class="pread"><span id="pOff">–</span><span class="unit">ms</span><span id="pWord"></span></div>
      <canvas id="pMeter"></canvas>
      <canvas id="pBar"></canvas>
      <div class="pstats"><div><b id="sMean">–</b><span id="sMeanL">Tendenz</span></div><div><b id="sSd">–</b><span>Streuung</span></div><div><b id="sHit">–</b><span>im Ziel ±30</span></div></div>
    </section>
  </div>
</div>

<script>
(()=>{
const SOUNDS=[
  {id:'crashL',code:'KeyQ',k:'Q',r:.95,mix:.45,cym:1},
  {id:'tom1',code:'KeyW',k:'W',r:.66,mix:.7},
  {id:'tom2',code:'KeyE',k:'E',r:.66,mix:.7},
  {id:'ride',code:'KeyR',k:'R',r:.86,mix:.42,cym:1},
  {id:'crashR',code:'KeyT',k:'T',r:.95,mix:.45,cym:1},
  {id:'hho',code:'KeyA',k:'A',r:.78,mix:.36,cym:1},
  {id:'hhc',code:'KeyS',k:'S',r:.78,mix:.36,cym:1},
  {id:'snare',code:'KeyD',k:'D',r:.52,mix:.82},
  {id:'floor',code:'KeyF',k:'F',r:.66,mix:.78},
  {id:'kick',code:'KeyG',k:'G',r:.36,mix:1},
];
const BY=Object.fromEntries(SOUNDS.map(s=>[s.id,s]));
const mod=(a,n)=>((a%n)+n)%n;
const clamp=v=>Math.max(0,Math.min(1,v));

/* ---------- instruments ---------- */
const DRUM_NAMES={crashL:'Crash L',tom1:'Tom 1',tom2:'Tom 2',ride:'Ride',crashR:'Crash R',hho:'HH auf',hhc:'HH zu',snare:'Snare',floor:'Floor',kick:'Kick'};
const DRUM_SHORT={hho:'auf',hhc:'HH zu',pedal:'zu'};
const KITS={
  synth:{label:'Akustik · Synth',names:DRUM_NAMES,short:DRUM_SHORT},
  akustik:{label:'Akustik · Samples',files:true,names:DRUM_NAMES,short:DRUM_SHORT},
  tr808:{label:'TR-808',files:true,names:{...DRUM_NAMES,tom1:'Tom hoch',tom2:'Tom mitte',floor:'Tom tief',ride:'Cowbell',crashL:'Clap',crashR:'Cymbal'},short:DRUM_SHORT},
  tr707:{label:'TR-707',files:true,names:{...DRUM_NAMES,tom1:'Tom hoch',tom2:'Tom mitte',floor:'Tom tief',crashL:'Crash',crashR:'Clap'},short:DRUM_SHORT},
  perc:{label:'Percussion',files:true,names:{kick:'Cajón Bass',snare:'Cajón Slap',tom1:'Bongo',tom2:'Conga',floor:'Tumba',hhc:'Shaker',hho:'Tambourin',ride:'Cowbell',crashL:'Clap',crashR:'Triangel'},short:{hho:'Tamb.',hhc:'Shaker',pedal:'Shaker'}},
};

/* ---------- synthesis (pre-rendered once) ---------- */
const SR=44100;
function shaper(o,amt){const s=o.createWaveShaper(),n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(amt*x)/Math.tanh(amt)}s.curve=c;return s}
function noise(o,d){const b=o.createBuffer(1,Math.ceil(SR*d),SR),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=o.createBufferSource();s.buffer=b;return s}
function filt(o,t,f,Q){const x=o.createBiquadFilter();x.type=t;x.frequency.value=f;if(Q!=null)x.Q.value=Q;return x}
function vca(o,peak,tau,att=.001){const g=o.createGain();g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(peak,att);g.gain.setTargetAtTime(0,att,tau);return g}
function chain(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1]}
function osc(o,type,f){const s=o.createOscillator();s.type=type;s.frequency.value=f;return s}
function metal(o,base,dur){const g=o.createGain();g.gain.value=.3;[2,3,4.16,5.43,6.79,8.21].forEach(r=>{const s=osc(o,'square',base*r);s.connect(g);s.start(0);s.stop(dur)});return g}
function tom(f,tau){return[tau*7,(o,out)=>{
  const a=osc(o,'sine',f*1.45);a.frequency.exponentialRampToValueAtTime(f,.05);a.frequency.exponentialRampToValueAtTime(f*.88,tau*4);
  chain(a,vca(o,1,tau,.002),shaper(o,1.4),out);a.start(0);
  const b=osc(o,'triangle',f*2.4);b.frequency.exponentialRampToValueAtTime(f*1.6,.05);chain(b,vca(o,.16,tau*.35),out);b.start(0);
  const n=noise(o,.1);chain(n,filt(o,'lowpass',4000),vca(o,.35,.012),out);n.start(0)}]}
function crash(base,bp){return[4,(o,out)=>{
  chain(metal(o,base,4),filt(o,'highpass',3500),vca(o,.55,.9,.002),out);
  const n=noise(o,4);chain(n,filt(o,'bandpass',bp,.6),vca(o,1,.8,.003),out);n.start(0);
  const m=noise(o,.2);chain(m,filt(o,'highpass',1500),vca(o,.7,.04),out);m.start(0)}]}
const RECIPES={
  kick:[.8,(o,out)=>{const a=osc(o,'sine',170);a.frequency.exponentialRampToValueAtTime(58,.07);a.frequency.exponentialRampToValueAtTime(42,.5);
    chain(a,vca(o,1,.16,.002),shaper(o,2),out);a.start(0);
    const n=noise(o,.05);chain(n,filt(o,'highpass',2000),vca(o,.5,.006),out);n.start(0)}],
  snare:[.6,(o,out)=>{[[185,.5],[330,.28]].forEach(([f,a])=>{const s=osc(o,'triangle',f*1.15);s.frequency.exponentialRampToValueAtTime(f,.03);chain(s,vca(o,a,.05),out);s.start(0)});
    const pk=filt(o,'peaking',4500,.8);pk.gain.value=6;const n=noise(o,.6);chain(n,filt(o,'highpass',1400),pk,vca(o,.9,.085),out);n.start(0);
    const m=noise(o,.05);chain(m,filt(o,'bandpass',2500,1),vca(o,.6,.008),out);m.start(0)}],
  tom1:tom(200,.14), tom2:tom(150,.17), floor:tom(96,.24),
  hhc:[.3,(o,out)=>{chain(metal(o,40,.3),filt(o,'bandpass',10000,.7),filt(o,'highpass',7000),vca(o,1,.022),out);const n=noise(o,.3);chain(n,filt(o,'highpass',8000),vca(o,.35,.015),out);n.start(0)}],
  hho:[1.6,(o,out)=>{chain(metal(o,40,1.6),filt(o,'bandpass',10000,.7),filt(o,'highpass',7000),vca(o,1,.28,.002),out);const n=noise(o,1.6);chain(n,filt(o,'highpass',8000),vca(o,.35,.22),out);n.start(0)}],
  crashL:crash(38,6200), crashR:crash(45,7600),
  ride:[3,(o,out)=>{chain(metal(o,58,3),filt(o,'bandpass',5200,1.4),vca(o,.8,.7),out);const n=noise(o,3);chain(n,filt(o,'highpass',7000),vca(o,.22,.5),out);n.start(0);
    [[780,.25],[1170,.15],[2350,.08]].forEach(([f,a])=>{const s=osc(o,'sine',f);chain(s,vca(o,a,.45),out);s.start(0)})}],
};
const BUF={synth:{}};
const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
function normalize(b){const a=b.getChannelData(0);let pk=0;for(let i=0;i<a.length;i++)pk=Math.max(pk,Math.abs(a[i]));
  const g=.95/(pk||1),fade=Math.floor(a.length*.1);for(let i=0;i<a.length;i++){a[i]*=g;if(i>a.length-fade)a[i]*=(a.length-i)/fade}return b}

  await Promise.all(Object.entries(RECIPES).map(async([id,[d,build]])=>{

  }));
}
const ready=renderSynth();
// sample kits: loaded on first use from samples/<kit>/<sound>.wav (cached offline by the app)
const decoder=new OAC(1,1,SR);
const decode=ab=>new Promise((res,rej)=>{const p=decoder.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
const kitLoads={};
function loadKit(k){
  if(!KITS[k]||!KITS[k].files)return Promise.resolve();
  if(!kitLoads[k])kitLoads[k]=(async()=>{BUF[k]={};
    await Promise.all(SOUNDS.map(async s=>{try{const r=await fetch(`samples/${k}/${s.id}.wav`);if(!r.ok)throw 0;
      const b=await decode(await r.arrayBuffer());const m=b.numberOfChannels>1?mono(b):b;BUF[k][s.id]=normalize(m)}catch(e){}}));
  })();

}
function mono(b){const o=decoder.createBuffer(1,b.length,b.sampleRate),d=o.getChannelData(0);for(let c=0;c<b.numberOfChannels;c++){const s=b.getChannelData(c);for(let i=0;i<s.length;i++)d[i]+=s[i]/b.numberOfChannels}return o}
const bufFor=(k,id)=>(BUF[k]&&BUF[k][id])||BUF.synth[id];

/* ---------- audio engine ---------- */
// signal path: sound → track gain (fader) → master gain (fader) → compressor → out. Live hits skip the track fader.
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let ac=null,out=null;
const tCurve=v=>v*v*1.5625, mCurve=v=>v*v*1.4;

    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.attack.value=.003;comp.release.value=.2;
    out=ac.createGain();out.gain.value=mCurve(st.mvol);out.connect(comp).connect(ac.destination);
    tracks.forEach(t=>{t.g=ac.createGain();t.g.gain.value=tCurve(t.vol);t.g.connect(out)});}
  if(ac.state!=='running')ac.resume();
  return ac;
}
let opens=[];
function play(id,t,fromLoop,dest,sti){
  const kit=stations[sti].kit,b=bufFor(kit,id);if(!b)return;
  const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=BY[id].mix*(.93+Math.random()*.07);
  s.connect(g).connect(dest||out);s.start(t);
  if(id==='hho'){opens=opens.filter(o=>o.t>t-2);opens.push({g,t,sti})}
  if(id==='hhc'){opens.forEach(o=>{if(o.t<t&&o.sti===sti)o.g.gain.setTargetAtTime(0,t,.012)})}
  const d=Math.max(0,(t-ac.currentTime)*1000);
  setTimeout(()=>flash(sti,id,fromLoop?.45:1),d);
}
function clickAt(t,lvl){ // 2 bar, 1 beat, 0 subdivision
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=[880,1180,1760][lvl];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime([.1,.2,.32][lvl],t+.001);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.06);
}

/* ---------- transport ---------- */
const st={bpm:100,num:4,den:4,click:true,sub:false,quant:0,mvol:.8,view:'kit',double:false,running:false,anchorTime:0,anchorBeat:0,schedBeat:0};
const stations=[{kit:'synth'},{kit:'tr808'}];
const spb=()=>60/st.bpm;
const beatAt=t=>st.anchorBeat+(t-st.anchorTime)/spb();
const timeAt=b=>st.anchorTime+(b-st.anchorBeat)*spb();
const gridOf=div=>st.den/div;
const grid=()=>gridOf(st.quant||16);
function startTransport(beat0,delay){st.running=true;st.anchorTime=ac.currentTime+delay;st.anchorBeat=beat0;st.schedBeat=beat0}
const LOOK=.12;
function scheduleTrack(tr,a,b,layers){
  const now=ac.currentTime,thr=st.quant?.6*grid()*spb()+.02:.03;
  for(const layer of layers||tr.layers){const L=layer.len,S=layer.start;for(const h of layer.hits){const hp=quant(h.r,L); // raw timing kept; Q applied live
    let occ=S+Math.ceil((a-S-hp)/L)*L+hp;
    for(;occ<b;occ+=L){const t=timeAt(occ);if(t<now-.002)continue;if(h.recAt&&Math.abs(t-h.recAt)<thr)continue;play(h.s,t,true,tr.g,tr.st)}
  }}
}
function tick(){
  if(!ac||!st.running)return;
  const a=st.schedBeat,b=beatAt(ac.currentTime+LOOK);if(b<=a)return;
  if(st.click||pr.on){const step=st.sub?.5:1;for(let k=Math.ceil(a/step)*step;k<b;k+=step){const t=timeAt(k);if(t>=ac.currentTime-.005)clickAt(t,k%1!==0?0:mod(k,st.num)===0?2:1)}}
  const ta=Math.max(a,0); // count-in: clicks only
  if(b>ta)for(const tr of tracks)if(tr.len&&(tr.mode==='play'||tr.mode==='dub'))scheduleTrack(tr,ta,b);
  st.schedBeat=b;
}
setInterval(tick,25);

/* ---------- tracks ---------- */
// mode: off | armed | rec (first take) | play | dub | stop. Layers {start,len,hits} loop on their own whole-bar length.
// While recording, hits only collect in `pending`; the take loops once it is finished.
const tracks=[0,1,2,3].map(i=>({i,st:i>>1,mode:'off',layers:[],len:0,start:0,pending:[],recStart:0,vol:.8,flashT:0,g:null}));
const visible=t=>st.double||t.st===0;
function quant(pos,len){if(!st.quant)return pos;const g=grid();return mod(Math.round(pos/g)*g,len)}
const gcd=(a,b)=>b?gcd(b,a%b):a;
function relayout(tr){
  if(!tr.layers.length){tr.len=0;tr.start=0;return}
  let c=tr.layers[0].len;for(const l of tr.layers)c=c*l.len/gcd(c,l.len);
  const mx=Math.max(...tr.layers.map(l=>l.len));
  tr.len=c>mx*8?mx:c;tr.start=tr.layers[0].start;
}
function finishTake(tr){
  const now=ac.currentTime,bpb=st.num;
  const sb=Math.round(tr.recStart/bpb)*bpb;
  const bars=Math.max(1,Math.ceil((beatAt(now)-sb-.75)/bpb)); // started bar = full bar; < 3/4 beat overshoot forgiven
  const len=bars*bpb;
  let fresh=null;
  if(tr.pending.length){
    fresh={start:sb,len,hits:tr.pending.map(p=>({s:p.s,r:mod(p.b-sb,len),recAt:timeAt(p.b)}))};
    tr.layers.push(fresh);relayout(tr);
  }
  tr.pending=[];
  if(!tr.layers.length){tr.mode='off';return}
  tr.mode='play';
  if(fresh)scheduleTrack(tr,beatAt(now),st.schedBeat,[fresh]);
  save();
}
function startDub(tr,from){tr.pending=[];tr.recStart=from;tr.mode='dub'}
function release(tr){if(tr.mode==='rec'||tr.mode==='dub')finishTake(tr);else if(tr.mode==='armed')tr.mode=tr.len?'stop':'off'}

function ringPress(i){ // empty → rec · rec → play · play → overdub · overdub → play · stopped → play
  const tr=tracks[i];if(!visible(tr))return;
  ensureCtx();const now=ac.currentTime;
  tracks.forEach(o=>{if(o!==tr&&['rec','dub','armed'].includes(o.mode))release(o)});
  switch(tr.mode){
    case 'armed':tr.mode='off';break;
    case 'rec':case 'dub':finishTake(tr);break;
    case 'play':startDub(tr,beatAt(now));break;
    case 'stop':if(!st.running)startTransport(0,.05);tr.mode='play';scheduleTrack(tr,beatAt(ac.currentTime),st.schedBeat);break;
    default:{
      const was=st.running;
      if(!was){if(st.click)startTransport(-st.num,.08);else{tr.mode='armed';break}}
      tr.mode='rec';tr.pending=[];tr.recStart=was?beatAt(now):0;
    }
  }
  maybeStop();ui();
}
function stopPress(i){
  const tr=tracks[i];if(!visible(tr))return;ensureCtx();
  if(tr.mode==='rec'||tr.mode==='dub')finishTake(tr);
  if(tr.mode==='armed')tr.mode='off';
  if(tr.mode==='play')tr.mode='stop';
  maybeStop();ui();
}
function undoLast(i){
  const tr=tracks[i];
  if(tr.mode==='dub'){tr.pending=[];tr.mode='play'}
  else if(tr.mode==='rec'){tr.pending=[];tr.mode='off'}

}
function clearTrack(i){

}
function allPress(){
  ensureCtx();
  if(st.running||tracks.some(t=>t.mode==='armed')){
    tracks.forEach(t=>{release(t);if(t.len)t.mode='stop'});st.running=false;pr.on=false;pUi();
  }else if(tracks.some(t=>t.len&&visible(t))){
    startTransport(0,.06);tracks.forEach(t=>{if(t.len&&visible(t))t.mode='play'});
  }

/* ---------- input ---------- */
async function hit(sti,id,ts){
  ensureCtx();await ready;
  const lag=ts!=null?(performance.now()-ts)/1000:0; // moment of the touch, not of the handler
  const now=ac.currentTime-(lag>0&&lag<.15?lag:0);
  play(id,ac.currentTime,false,null,sti);
  if(pr.on&&st.running)practiceHit(id,now);
  const tr=tracks.find(t=>t.st===sti&&['armed','rec','dub'].includes(t.mode));if(!tr)return;
  if(tr.mode==='armed'){
    st.running=true;st.anchorTime=now;st.anchorBeat=0;st.schedBeat=0;
    tr.mode='rec';tr.recStart=0;tr.pending=[{s:id,b:0}];ui();return;
  }
  if(!st.running)return;
  tr.pending.push({s:id,b:beatAt(now)});
}

function flash(si,id,a){(FL[si][id]||[]).forEach(el=>{if(el.closest('[hidden]'))return;
  el.animate([{opacity:a*(el.tagName==='SPAN'?.85:.45)},{opacity:0}],{duration:a<1?260:200,easing:'ease-out'})})}

function setView(v){st.view=v==='pads'?'pads':'kit';instEl.forEach(h=>{h.pads.hidden=st.view!=='pads';h.svg.style.display=st.view==='kit'?'':'none'});
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.view))}
document.querySelectorAll('#viewSeg button').forEach(b=>press(b,()=>{setView(b.dataset.v);save()}));

function setDouble(on){
  st.double=!!on;mainEl.classList.toggle('dbl',st.double);
  consEl[1].hidden=!st.double||!pracEl.hidden;instEl[1].hidden=!st.double;
  $('#dblBtn').setAttribute('aria-pressed',st.double);
  if(!st.double&&ac){tracks.filter(t=>t.st===1).forEach(t=>{release(t);if(t.len)t.mode='stop'});maybeStop()}
  ui();
}
press($('#dblBtn'),()=>{setDouble(!st.double);save()});

let wl=null;
async function keepAwake(){try{if(st.running&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
  else if(!st.running&&wl){wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});

function ui(){
  $('#sig').disabled=st.running||tracks.some(t=>t.len||t.mode!=='off');
  const ab=$('#allBtn'),on=st.running||tracks.some(t=>t.mode==='armed');
  ab.innerHTML=on?ICON.stop:ICON.play;ab.classList.toggle('on',on);
  tracks.forEach(tr=>{tr.ringEl.className='ring st-'+tr.mode});
  keepAwake();
}

/* ---------- drawing ---------- */
const css=getComputedStyle(document.documentElement);
const C=k=>css.getPropertyValue(k).trim();
const COL={rec:C('--rec'),play:C('--play'),dub:C('--dub'),line:C('--line'),fg:C('--fg'),dim:C('--dim'),raised:C('--raised')};
function sizeCv(cv){const d=window.devicePixelRatio||1,W=Math.round(cv.clientWidth*d),H=Math.round(cv.clientHeight*d);
  if(!W||!H)return null;if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}return[cv.getContext('2d'),W,H,d]}
const heardBeat=()=>ac?beatAt(ac.currentTime):0;
const recBars=(tr,b)=>{const e=b-Math.round(tr.recStart/st.num)*st.num;return{e,bars:Math.max(1,Math.floor(e/st.num)+1)}};
function posInfo(){
  const bpb=st.num,vis=tracks.filter(visible),maxL=Math.max(0,...vis.map(t=>t.len));
  if(!ac||!st.running)return{segs:maxL||bpb,cur:-1,txt:'–',len:maxL?`/ ${maxL/bpb} T`:'',col:COL.dim};
  const b=heardBeat();
  if(b<0)return{segs:bpb,cur:mod(Math.floor(b),bpb),txt:'– '+Math.ceil(-b),len:'ein',col:COL.rec};
  const r=tracks.find(t=>t.mode==='rec');
  if(r){const{e,bars}=recBars(r,b);return{segs:bars*bpb,cur:Math.max(0,Math.floor(e)),txt:`${bars}.${mod(Math.floor(e),bpb)+1}`,len:'● rec',col:COL.rec}}
  const pl=tracks.filter(t=>t.len&&(t.mode==='play'||t.mode==='dub'));
  if(pl.length){const L=Math.max(...pl.map(t=>t.len)),ref=pl.find(t=>t.len===L),p=mod(b-ref.start,L);
    return{segs:L,cur:Math.floor(p),txt:`${Math.floor(p/bpb)+1}.${Math.floor(p%bpb)+1}`,len:`/ ${L/bpb} T`,col:tracks.some(t=>t.mode==='dub')?COL.dub:COL.play}}
  return{segs:bpb,cur:mod(Math.floor(b),bpb),txt:`${Math.floor(b/bpb)+1}.${mod(Math.floor(b),bpb)+1}`,len:'',col:COL.fg};
}
const posCv=$('#posCv'),posTxt=$('#posTxt'),posLen=$('#posLen');
function drawPos(){
  const r=sizeCv(posCv);if(!r)return;const[g,W,H,d]=r;g.clearRect(0,0,W,H);
  const p=posInfo(),n=p.segs,gap=Math.max(1,Math.min(4*d,W/n*.18)),w=(W-gap*(n-1))/n;
  for(let k=0;k<n;k++){const bar=k%st.num===0,h=bar?H:H*.62,y=(H-h)/2;
    g.fillStyle=k<=p.cur?p.col:COL.line;g.globalAlpha=k===p.cur?1:k<p.cur?.38:1;g.fillRect(k*(w+gap),y,w,h)}
  g.globalAlpha=1;
  if(posTxt.textContent!==p.txt)posTxt.textContent=p.txt;posTxt.style.color=p.col===COL.dim?'':p.col;
  if(posLen.textContent!==p.len)posLen.textContent=p.len;
}
function drawRing(tr){
  const r=sizeCv(tr.cv);if(!r)return;const[g,W]=r;g.clearRect(0,0,W,W);
  const cx=W/2,R=W*.445,lw=W*.055,bpb=st.num,b=heardBeat();
  let segs=tr.len||bpb,cur=-1,col=COL.line,lit=0;
  const blink=Math.floor(performance.now()/300)%2===0;
  if(tr.mode==='armed'){col=COL.rec;lit=blink?2:0}
  else if(tr.mode==='rec'&&st.running){col=COL.rec;lit=1;
    if(b<0){segs=bpb;cur=mod(Math.floor(b),bpb)}else{const{e,bars}=recBars(tr,b);segs=bars*bpb;cur=Math.max(0,Math.floor(e))}}
  else if((tr.mode==='play'||tr.mode==='dub')&&st.running){col=tr.mode==='dub'?COL.dub:COL.play;lit=1;cur=b<0?-1:Math.floor(mod(b-tr.start,tr.len))}
  else if(tr.mode==='stop'||tr.mode==='play'){col=COL.play}
  const gap=Math.min(.1,1.4/segs);
  for(let k=0;k<segs;k++){
    const a0=-Math.PI/2+k/segs*Math.PI*2+gap/2,a1=a0+Math.PI*2/segs-gap;
    g.beginPath();g.arc(cx,cx,R,a0,a1);g.lineWidth=k%bpb===0?lw:lw*.7;
    if(lit===2||(lit===1&&k===cur)){g.strokeStyle=col;g.globalAlpha=1;g.shadowColor=col;g.shadowBlur=W*.04}
    else if(lit===1&&k<cur){g.strokeStyle=col;g.globalAlpha=.4;g.shadowBlur=0}
    else{g.strokeStyle=tr.len?col:COL.line;g.globalAlpha=tr.len?.18:1;g.shadowBlur=0}
    g.stroke();
  }
  g.shadowBlur=0;g.globalAlpha=1;
  const fl=performance.now()-tr.flashT;
  if(fl<350){g.globalAlpha=1-fl/350;g.strokeStyle=COL.fg;g.lineWidth=lw*1.2;g.beginPath();g.arc(cx,cx,R,0,Math.PI*2);g.stroke();g.globalAlpha=1}
  let lab=tr.len?`${tr.len/bpb} T${tr.layers.length>1?' · '+tr.layers.length+'×':''}`:'';
  if(tr.mode==='dub'&&st.running){lab=`● ${b<Math.round(tr.recStart/bpb)*bpb?1:recBars(tr,b).bars} T`}
  if(tr.lenEl.textContent!==lab)tr.lenEl.textContent=lab;
}

/* ---------- practice ---------- */
const pr={on:false,div:16,hits:[]};
const goodMs=12,okMs=30;
const accCol=o=>{const a=Math.abs(o);return a<=goodMs?COL.play:a<=okMs?COL.dub:COL.rec};
const pracEl=$('#prac'),meterCv=$('#pMeter'),barCv=$('#pBar');
function measure(h){const g=gridOf(pr.div);h.n=Math.round(h.b/g)*g;h.off=(h.b-h.n)*spb()*1000}
function practiceHit(id,t){const b=beatAt(t);if(b<-.5)return;const h={b,s:id};measure(h);pr.hits.push(h);if(pr.hits.length>200)pr.hits.shift();pShow()}
function pShow(){
  const last=pr.hits[pr.hits.length-1],offEl=$('#pOff'),w=$('#pWord');
  if(!last){offEl.textContent='–';offEl.style.color='';w.textContent='';w.style.color='';
    $('#sMean').textContent='–';$('#sMeanL').textContent='Tendenz';$('#sSd').textContent='–';$('#sHit').textContent='–';return}
  const o=Math.round(last.off);
  offEl.textContent=(o>0?'+':o<0?'−':'±')+Math.abs(o);offEl.style.color=accCol(last.off);
  w.textContent=Math.abs(last.off)<=goodMs?'genau':last.off>0?'spät':'früh';w.style.color=accCol(last.off);
  const rec=pr.hits.slice(-32),n=rec.length,mean=rec.reduce((a,h)=>a+h.off,0)/n;
  const sd=Math.sqrt(rec.reduce((a,h)=>a+(h.off-mean)**2,0)/n),inT=rec.filter(h=>Math.abs(h.off)<=okMs).length/n,m=Math.round(mean);
  $('#sMean').textContent=(m>0?'+':m<0?'−':'±')+Math.abs(m)+' ms';
  $('#sMeanL').textContent=n<4?'Tendenz':Math.abs(mean)<6?'mittig':mean>0?'schleppt':'eilt';
  $('#sSd').textContent='± '+Math.round(sd)+' ms';
  $('#sHit').textContent=Math.round(inT*100)+' %';
}
function pUi(){const b=$('#pGo');b.innerHTML=pr.on?ICON.stop:ICON.play;b.classList.toggle('on',pr.on)}
function pStart(){ensureCtx();tracks.forEach(release);pr.on=true;pr.hits=[];if(!st.running)startTransport(0,.1);pUi();pShow();ui()}
function pStop(){pr.on=false;maybeStop();pUi();ui()}
function drawMeter(){
  const r=sizeCv(meterCv);if(!r)return;const[g,W,H,d]=r;g.clearRect(0,0,W,H);
  const half=Math.min(gridOf(pr.div)*spb()*500,120),cx=W/2,sx=(W/2-14*d)/half;
  const X=o=>cx+Math.max(-half,Math.min(half,o))*sx,top=H*.14,h=H*.56;
  g.fillStyle=COL.raised;g.fillRect(X(-half),top,X(half)-X(-half),h);
  g.globalAlpha=.22;g.fillStyle=COL.dub;g.fillRect(X(-okMs),top,X(okMs)-X(-okMs),h);
  g.globalAlpha=.35;g.fillStyle=COL.play;g.fillRect(X(-goodMs),top,X(goodMs)-X(-goodMs),h);
  g.globalAlpha=1;g.fillStyle=COL.fg;g.fillRect(cx-d,top-4*d,2*d,h+8*d);
  const hs=pr.hits.slice(-24);
  hs.forEach((p,i)=>{const age=hs.length-1-i,last=!age,w=(last?5:3)*d;
    g.globalAlpha=last?1:Math.max(.15,.65-age*.025);g.fillStyle=accCol(p.off);
    g.fillRect(X(p.off)-w/2,last?top-7*d:top+h*.18,w,last?h+14*d:h*.64)});
  g.globalAlpha=1;g.fillStyle=COL.dim;g.textBaseline='alphabetic';
  g.font=`600 ${13*d}px ${C('--f-ui')}`;g.textAlign='left';g.fillText('FRÜH',X(-half),H-3*d);
  g.textAlign='right';g.fillText('SPÄT',X(half),H-3*d);
  g.textAlign='center';g.font=`${11*d}px ${C('--f-num')}`;g.fillText(`±${Math.round(half)} ms`,cx,H-3*d);
}
function drawBar(){
  const r=sizeCv(barCv);if(!r)return;const[g,W,H,d]=r;g.clearRect(0,0,W,H);
  const bpb=st.num,gs=gridOf(pr.div),pad=10*d,span=W-2*pad,x=b=>pad+b/bpb*span;
  for(let k=0;k<bpb-1e-6;k+=gs){const strong=Math.abs(k-Math.round(k))<1e-6;
    g.fillStyle=strong?COL.dim:COL.line;g.globalAlpha=strong?(k<1e-6?.9:.55):1;
    const w=strong?2*d:d;g.fillRect(Math.round(x(k)-w/2),0,w,H)}
  g.globalAlpha=1;
  const heard=heardBeat(),curBar=Math.floor(heard/bpb);
  if(pr.on&&st.running&&heard>=0){g.fillStyle=COL.fg;g.globalAlpha=.25;g.fillRect(x(mod(heard,bpb))-d,0,2*d,H);g.globalAlpha=1}
  for(const p of pr.hits){const age=curBar-Math.floor(p.n/bpb);if(age>1||age<0)continue;
    const px=x(mod(p.n,bpb)+(p.b-p.n)),y=H*.14+(1-(BY[p.s].r-.36)/.59)*H*.72;
    g.globalAlpha=age?.3:1;g.fillStyle=accCol(p.off);
    g.beginPath();g.arc(px,y,(p.s==='kick'?6:4.5)*d,0,Math.PI*2);g.fill()}
  g.globalAlpha=1;
}
function frame(){
  drawPos();
  if(pracEl.hidden)tracks.forEach(t=>{if(visible(t))drawRing(t)});
  else{drawMeter();drawBar()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- controls ---------- */
const bpmIn=$('#bpm');
function setBpm(v){
  v=Math.max(40,Math.min(240,Math.round(v)||st.bpm));
  if(st.running&&ac){const now=ac.currentTime,b=beatAt(now);st.bpm=v;st.anchorTime=now;st.anchorBeat=b}else st.bpm=v;
  bpmIn.value=v;save();
}
bpmIn.addEventListener('change',()=>setBpm(+bpmIn.value));
bpmIn.addEventListener('keydown',e=>{if(e.key==='Enter')bpmIn.blur()});
press($('#bpmDown'),()=>setBpm(st.bpm-1));press($('#bpmUp'),()=>setBpm(st.bpm+1));
let taps=[];
press($('#tap'),()=>{const t=performance.now();if(taps.length&&t-taps[taps.length-1]>2000)taps=[];taps.push(t);taps=taps.slice(-5);
  if(taps.length>1){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(60000/iv)}});
$('#sig').addEventListener('change',e=>{const[n,d]=e.target.value.split('/').map(Number);st.num=n;st.den=d;save();ui()});
const tog=(id,key)=>press($(id),()=>{st[key]=!st[key];$(id).setAttribute('aria-pressed',st[key]);save()});
tog('#click','click');tog('#sub','sub');
const QS=[0,16,8,4];
function qShow(){$('#quant').setAttribute('aria-pressed',!!st.quant);$('#qVal').textContent=st.quant?'1/'+st.quant:'aus'}
press($('#quant'),()=>{st.quant=QS[(QS.indexOf(st.quant)+1)%QS.length];qShow();save()});
function setTab(t){const p=t==='uebung';
  consEl[0].hidden=p;consEl[1].hidden=p||!st.double;mEl.hidden=p;pracEl.hidden=!p;
  $('#tabLoop').setAttribute('aria-selected',!p);$('#tabPrac').setAttribute('aria-selected',p);
  if(p){if(ac)tracks.forEach(release);ui()}else if(pr.on)pStop();
  try{history.replaceState(null,'','#'+t)}catch(e){}}
press($('#tabLoop'),()=>setTab('loop'));press($('#tabPrac'),()=>setTab('uebung'));
function pdivShow(){document.querySelectorAll('#pdiv button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.d===pr.div))}
document.querySelectorAll('#pdiv button').forEach(b=>press(b,()=>{pr.div=+b.dataset.d;pdivShow();pr.hits.forEach(measure);pShow();save()}));
$('#pReset').innerHTML=ICON.clear;
press($('#pReset'),()=>{pr.hits=[];pShow()});
press($('#pGo'),()=>pr.on?pStop():pStart());

const CODE=Object.fromEntries(SOUNDS.map(s=>[s.code,s.id]));
function spacePress(){
  const r=tracks.find(t=>['rec','dub','armed'].includes(t.mode));
  if(r){ensureCtx();if(r.mode==='armed')r.mode=r.len?'stop':'off';else release(r);maybeStop();ui()}
  else allPress();
}
addEventListener('keydown',e=>{
  if(e.target===bpmIn||e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)!pracEl.hidden?(pr.on?pStop():pStart()):spacePress();return}
  if(e.code==='Escape'){e.preventDefault();if(st.running||tracks.some(t=>t.mode==='armed'))allPress();return}
  const dm=/^Digit([1-4])$/.exec(e.code);
  if(dm){e.preventDefault();if(e.repeat)return;const i=+dm[1]-1;e.shiftKey?stopPress(i):ringPress(i);return}
  const id=CODE[e.code];if(id){e.preventDefault();if(e.repeat)return;
    const r=tracks.find(t=>['rec','dub','armed'].includes(t.mode));hit(r?r.st:0,id,e.timeStamp)}
});
addEventListener('keyup',e=>{if(e.code==='Space'&&e.target!==bpmIn)e.preventDefault()});

/* ---------- persistence (this device only) ---------- */
const KEY='drumloop-station-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({bpm:st.bpm,num:st.num,den:st.den,click:st.click,sub:st.sub,quant:st.quant,pdiv:pr.div,mvol:st.mvol,view:st.view,
  double:st.double,kits:stations.map(s=>s.kit),
  tracks:tracks.map(t=>({vol:t.vol,layers:t.layers.map(l=>({start:l.start,len:l.len,hits:l.hits.map(h=>({s:h.s,r:h.r}))}))}))}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d){Object.assign(st,{bpm:d.bpm||100,num:d.num||4,den:d.den||4,click:d.click!==false,sub:!!d.sub,quant:d.quant===true?16:[4,8,16].includes(d.quant)?d.quant:0,
      mvol:typeof d.mvol==='number'?clamp(d.mvol):.8,view:d.view==='pads'?'pads':'kit',double:!!d.double});
    if(Array.isArray(d.kits))d.kits.forEach((k,i)=>{if(stations[i]&&KITS[k])stations[i].kit=k});
    if([4,8,16].includes(d.pdiv))pr.div=d.pdiv;
    (d.tracks||[]).forEach((t,i)=>{if(!tracks[i])return;if(typeof t.vol==='number')tracks[i].vol=clamp(t.vol);
      if(!t.layers||!t.layers.length)return;
      const layers=t.layers.map(l=>Array.isArray(l)?{start:t.start||0,len:t.len,hits:l}:l).filter(l=>l.len&&l.hits&&l.hits.length);
      layers.forEach(l=>l.hits.forEach(h=>{if(h.r==null)h.r=h.pos||0}));
      if(layers.length){tracks[i].layers=layers;tracks[i].mode='stop';relayout(tracks[i])}});}
}catch(e){}
bpmIn.value=st.bpm;$('#sig').value=`${st.num}/${st.den}`;
$('#click').setAttribute('aria-pressed',st.click);$('#sub').setAttribute('aria-pressed',st.sub);
qShow();pdivShow();pUi();pShow();setView(st.view);
tracks.forEach(t=>t.showFader());showMaster();
stations.forEach((s,i)=>setKit(i,s.kit));
setDouble(st.double);
setTab(location.hash==='#uebung'?'uebung':'loop');ui();

/* offline app: service worker only where the page runs on its own (installed / hosted), never inside a frame */
try{if('serviceWorker' in navigator&&window.top===window&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
